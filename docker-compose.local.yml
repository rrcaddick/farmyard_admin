volumes:
  farmyard_admin_local_postgres_data: {}
  farmyard_admin_local_postgres_data_backups: {}
  farmyard_admin_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: farmyard_admin_local_django
    container_name: farmyard_admin_local_django
    depends_on:
      - postgres
      - redis
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: farmyard_admin_production_postgres
    container_name: farmyard_admin_local_postgres
    volumes:
      - farmyard_admin_local_postgres_data:/var/lib/postgresql/18/docker
      - farmyard_admin_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  redis:
    image: docker.io/redis:8.4
    container_name: farmyard_admin_local_redis
    volumes:
      - farmyard_admin_local_redis_data:/data

  celeryworker:
    <<: *django
    image: farmyard_admin_local_celeryworker
    container_name: farmyard_admin_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: farmyard_admin_local_celerybeat
    container_name: farmyard_admin_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: farmyard_admin_local_flower
    container_name: farmyard_admin_local_flower
    ports:
      - "5555:5555"
    command: /start-flower
